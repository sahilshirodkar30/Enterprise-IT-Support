
name: Enterprise AI CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-deployment
  cancel-in-progress: false

jobs:

  # ==========================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================

  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python Syntax
        run: |
          python -m compileall -q app worker scripts

  # ==========================================
  # 2. BUILD AND PUSH DOCKER IMAGE TO ECR
  # ==========================================

  build-and-push-ecr-image:
    name: Build and Push to ECR
    needs: integration
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          set -euo pipefail

          test -n "$ECR_REGISTRY"
          test -n "$ECR_REPOSITORY"

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building Docker image..."

          docker build -t "$IMAGE" .

          echo "Pushing image to ECR..."

          docker push "$IMAGE"

          echo "Image pushed successfully: $IMAGE"

  # ==========================================
  # 3. DEPLOY APPLICATION TO EC2
  # ==========================================

  continuous-deployment:
    name: Deploy to EC2
    needs: build-and-push-ecr-image

    runs-on: [self-hosted, linux, x64]
    environment: production

    steps:

      # ----------------------------------------
      # AWS AUTHENTICATION
      # EC2 INSTANCE IAM ROLE IS USED HERE
      # ----------------------------------------

      - name: Verify EC2 IAM Role
        run: |
          set -euo pipefail

          aws sts get-caller-identity

      # ----------------------------------------
      # CONSTRUCT IMAGE URI
      # ----------------------------------------

      - name: Construct ECR Image URI
        id: image

        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}

        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "ECR image URI constructed successfully"

      # ----------------------------------------
      # LOGIN TO ECR
      # ----------------------------------------

      - name: Login to Amazon ECR
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          aws ecr get-login-password \
            --region "$AWS_REGION" |
          docker login \
            --username AWS \
            --password-stdin "$REGISTRY"

      # ----------------------------------------
      # PULL DOCKER IMAGE
      # ----------------------------------------

      - name: Pull Docker Image
        env:
          IMAGE: ${{ steps.image.outputs.image }}

        run: |
          set -euo pipefail

          docker pull "$IMAGE"

          echo "Docker image pulled successfully"

      # ----------------------------------------
      # VALIDATE APPLICATION SECRETS
      # ----------------------------------------

      - name: Validate Application Secrets

        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

          BEDROCK_EMBED_MODEL: ${{ secrets.BEDROCK_EMBED_MODEL }}
          BEDROCK_CHAT_MODEL: ${{ secrets.BEDROCK_CHAT_MODEL }}
          EMBED_DIM: ${{ secrets.EMBED_DIM }}

          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          PINECONE_READY_TIMEOUT: ${{ secrets.PINECONE_READY_TIMEOUT }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          RIUS_API_KEY: ${{ secrets.RIUS_API_KEY }}
          RIUS_SERVICE_NAME: ${{ secrets.RIUS_SERVICE_NAME }}
          RIUS_DISABLED: ${{ secrets.RIUS_DISABLED }}
          RIUS_CAPTURE_CONTENT: ${{ secrets.RIUS_CAPTURE_CONTENT }}

          HITL_ENABLED: ${{ secrets.HITL_ENABLED }}
          MEMORY_TURNS: ${{ secrets.MEMORY_TURNS }}

        run: |
          set -euo pipefail

          REQUIRED=(
            AWS_REGION
            S3_BUCKET
            BEDROCK_EMBED_MODEL
            BEDROCK_CHAT_MODEL
            EMBED_DIM
            PINECONE_API_KEY
            PINECONE_INDEX_NAME
            PINECONE_CLOUD
            PINECONE_REGION
            PINECONE_READY_TIMEOUT
            DATABASE_URL
            RIUS_API_KEY
            RIUS_SERVICE_NAME
            RIUS_DISABLED
            RIUS_CAPTURE_CONTENT
            HITL_ENABLED
            MEMORY_TURNS
          )

          for name in "${REQUIRED[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done

          echo "All required application secrets are available"

      # ----------------------------------------
      # CREATE DOCKER NETWORK
      # ----------------------------------------

      - name: Create Docker Network
        run: |
          set -euo pipefail

          docker network inspect atlas-network >/dev/null 2>&1 || \
            docker network create atlas-network

      # ----------------------------------------
      # STOP OLD CONTAINERS
      # ----------------------------------------

      - name: Stop Old Containers
        run: |
          docker rm -f atlas-enterprise-api || true
          docker rm -f atlas-enterprise-ui || true

      # ----------------------------------------
      # START FASTAPI BACKEND
      # ----------------------------------------

      - name: Start FastAPI Container

        env:
          IMAGE: ${{ steps.image.outputs.image }}

          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

          BEDROCK_EMBED_MODEL: ${{ secrets.BEDROCK_EMBED_MODEL }}
          BEDROCK_CHAT_MODEL: ${{ secrets.BEDROCK_CHAT_MODEL }}
          EMBED_DIM: ${{ secrets.EMBED_DIM }}

          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          PINECONE_READY_TIMEOUT: ${{ secrets.PINECONE_READY_TIMEOUT }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          RIUS_API_KEY: ${{ secrets.RIUS_API_KEY }}
          RIUS_SERVICE_NAME: ${{ secrets.RIUS_SERVICE_NAME }}
          RIUS_DISABLED: ${{ secrets.RIUS_DISABLED }}
          RIUS_CAPTURE_CONTENT: ${{ secrets.RIUS_CAPTURE_CONTENT }}

          HITL_ENABLED: ${{ secrets.HITL_ENABLED }}
          MEMORY_TURNS: ${{ secrets.MEMORY_TURNS }}

        run: |
          set -euo pipefail

          docker run -d \
            --name atlas-enterprise-api \
            --restart unless-stopped \
            --network atlas-network \
            --network-alias api \
            -p 8000:8000 \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION="$AWS_REGION" \
            -e S3_BUCKET \
            -e BEDROCK_EMBED_MODEL \
            -e BEDROCK_CHAT_MODEL \
            -e EMBED_DIM \
            -e PINECONE_API_KEY \
            -e PINECONE_INDEX_NAME \
            -e PINECONE_CLOUD \
            -e PINECONE_REGION \
            -e PINECONE_READY_TIMEOUT \
            -e DATABASE_URL \
            -e RIUS_API_KEY \
            -e RIUS_SERVICE_NAME \
            -e RIUS_DISABLED \
            -e RIUS_CAPTURE_CONTENT \
            -e HITL_ENABLED \
            -e MEMORY_TURNS \
            "$IMAGE" \
            uvicorn app.main:app --host 0.0.0.0 --port 8000

          echo "FastAPI container started"

      # ----------------------------------------
      # START STREAMLIT FRONTEND
      # ----------------------------------------

      - name: Start Streamlit Container

        env:
          IMAGE: ${{ steps.image.outputs.image }}

          API_URL: http://api:8000

        run: |
          set -euo pipefail

          docker run -d \
            --name atlas-enterprise-ui \
            --restart unless-stopped \
            --network atlas-network \
            -p 8501:8501 \
            -e API_URL \
            "$IMAGE" \
            streamlit run ui/app.py \
              --server.address 0.0.0.0 \
              --server.port 8501 \
              --server.headless true

          echo "Streamlit container started"

      # ----------------------------------------
      # VERIFY FASTAPI
      # ----------------------------------------

      - name: Verify FastAPI Deployment
        run: |
          set -euo pipefail

          for i in {1..15}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/health; then

              echo "FastAPI health check successful"
              exit 0
            fi

            echo "Waiting for FastAPI..."
            sleep 5
          done

          echo "::error::FastAPI health check failed"

          docker logs --tail 100 atlas-enterprise-api

          exit 1

      # ----------------------------------------
      # VERIFY STREAMLIT
      # ----------------------------------------

      - name: Verify Streamlit Deployment
        run: |
          set -euo pipefail

          for i in {1..15}; do
            if curl --fail --silent \
              http://127.0.0.1:8501/_stcore/health; then

              echo "Streamlit health check successful"
              exit 0
            fi

            echo "Waiting for Streamlit..."
            sleep 5
          done

          echo "::error::Streamlit health check failed"

          docker logs --tail 100 atlas-enterprise-ui

          exit 1

      # ----------------------------------------
      # SHOW RUNNING CONTAINERS
      # ----------------------------------------

      - name: Deployment Status
        run: |
          docker ps

          echo "Enterprise AI deployment completed successfully"

      # ----------------------------------------
      # CLEANUP OLD DOCKER IMAGES
      # ----------------------------------------

      - name: Clean Unused Docker Images
        if: always()
        run: |
          docker image prune -f
