
name: Enterprise AI CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-deployment
  cancel-in-progress: false

jobs:

  # ==========================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================

  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python Syntax
        run: |
          python -m compileall -q app frontend

  # ==========================================
  # 2. BUILD AND PUSH DOCKER IMAGE TO ECR
  # ==========================================

  build-and-push-ecr-image:
    name: Build and Push to ECR
    needs: integration
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          set -euo pipefail

          if [[ -z "$ECR_REGISTRY" || -z "$ECR_REPOSITORY" ]]; then
            echo "::error::ECR registry or repository is empty"
            exit 1
          fi

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building Docker image..."
          docker build -t "$IMAGE" .

          echo "Pushing Docker image to ECR..."
          docker push "$IMAGE"

          echo "Docker image pushed successfully"

  # ==========================================
  # 3. DEPLOY APPLICATION TO EC2
  # ==========================================

  continuous-deployment:
    name: Deploy to EC2
    needs: build-and-push-ecr-image
    runs-on: [self-hosted, linux, x64]
    environment: production

    steps:

      - name: Verify EC2 IAM Role
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      # ----------------------------------------
      # CONSTRUCT IMAGE URI
      # ----------------------------------------

      - name: Construct ECR Image URI
        id: image
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

        run: |
          set -euo pipefail

          if [[ -z "$AWS_REGION" || -z "$ECR_REPOSITORY" ]]; then
            echo "::error::AWS_REGION or ECR_REPOSITORY is empty"
            exit 1
          fi

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "ECR image URI constructed successfully"

      # ----------------------------------------
      # LOGIN TO ECR
      # ----------------------------------------

      - name: Login to Amazon ECR
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          aws ecr get-login-password \
            --region "$AWS_REGION" |
          docker login \
            --username AWS \
            --password-stdin "$REGISTRY"

      # ----------------------------------------
      # PULL DOCKER IMAGE
      # ----------------------------------------

      - name: Pull Docker Image
        env:
          IMAGE: ${{ steps.image.outputs.image }}

        run: |
          set -euo pipefail

          docker pull "$IMAGE"

          echo "Docker image pulled successfully"

      # ----------------------------------------
      # CREATE DOCKER NETWORK
      # ----------------------------------------

      - name: Create Docker Network
        run: |
          set -euo pipefail

          docker network inspect atlas-network >/dev/null 2>&1 || \
            docker network create atlas-network

      # ----------------------------------------
      # STOP OLD CONTAINERS
      # ----------------------------------------

      - name: Stop Old Containers
        run: |
          docker rm -f atlas-enterprise-api || true
          docker rm -f atlas-enterprise-ui || true

      # ----------------------------------------
      # START FASTAPI BACKEND
      # ----------------------------------------

      - name: Start FastAPI Container
        env:
          IMAGE: ${{ steps.image.outputs.image }}

          APP_ENV: ${{ secrets.APP_ENV }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DEV_AUTH_TOKEN: ${{ secrets.DEV_AUTH_TOKEN }}

          AWS_REGION: ${{ secrets.AWS_REGION }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL_NAME: ${{ secrets.GROQ_MODEL_NAME }}
          GROQ_SLUG: ${{ secrets.GROQ_SLUG }}

          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL_NAME: ${{ secrets.DEEPSEEK_MODEL_NAME }}
          DEEPSEEK_SLUG: ${{ secrets.DEEPSEEK_SLUG }}

          PORTKEY_CONFIG_SLUG: ${{ secrets.PORTKEY_CONFIG_SLUG }}
          PORTKEY_GATEWAY_API_KEY: ${{ secrets.PORTKEY_GATEWAY_API_KEY }}
          PORTKEY_GATEWAY_URL: ${{ secrets.PORTKEY_GATEWAY_URL }}

          EMBEDDING_MODEL_NAME: ${{ secrets.EMBEDDING_MODEL_NAME }}
          EMBEDDING_MODEL_DIMENSION: ${{ secrets.EMBEDDING_MODEL_DIMENSION }}

          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

          LOGFIRE_API_KEY: ${{ secrets.LOGFIRE_API_KEY }}

        run: |
          set -euo pipefail

          docker run -d \
            --name atlas-enterprise-api \
            --restart unless-stopped \
            --network atlas-network \
            --network-alias api \
            -p 8000:8000 \
            -e APP_ENV \
            -e API_TOKEN \
            -e DEV_AUTH_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION="$AWS_REGION" \
            -e GROQ_API_KEY \
            -e GROQ_MODEL_NAME \
            -e GROQ_SLUG \
            -e DEEPSEEK_API_KEY \
            -e DEEPSEEK_MODEL_NAME \
            -e DEEPSEEK_SLUG \
            -e PORTKEY_CONFIG_SLUG \
            -e PORTKEY_GATEWAY_API_KEY \
            -e PORTKEY_GATEWAY_URL \
            -e EMBEDDING_MODEL_NAME \
            -e EMBEDDING_MODEL_DIMENSION \
            -e PINECONE_API_KEY \
            -e PINECONE_INDEX_NAME \
            -e LOGFIRE_API_KEY \
            "$IMAGE" \
            uvicorn app.api:app \
              --host 0.0.0.0 \
              --port 8000 \
              --proxy-headers

          echo "FastAPI container started"

      # ----------------------------------------
      # START STREAMLIT FRONTEND
      # ----------------------------------------

      - name: Start Streamlit Container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          API_URL: http://api:8000
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DEV_AUTH_TOKEN: ${{ secrets.DEV_AUTH_TOKEN }}

        run: |
          set -euo pipefail

          docker run -d \
            --name atlas-enterprise-ui \
            --restart unless-stopped \
            --network atlas-network \
            -p 8501:8501 \
            -e API_URL \
            -e API_TOKEN \
            -e DEV_AUTH_TOKEN \
            "$IMAGE" \
            streamlit run frontend/streamlit_app.py \
              --server.address 0.0.0.0 \
              --server.port 8501 \
              --server.headless true

          echo "Streamlit container started"

      # ----------------------------------------
      # VERIFY FASTAPI
      # ----------------------------------------

      - name: Verify FastAPI Deployment
        run: |
          set -euo pipefail

          for i in {1..15}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/health; then

              echo "FastAPI health check successful"
              exit 0
            fi

            echo "Waiting for FastAPI..."
            sleep 5
          done

          echo "::error::FastAPI health check failed"
          docker logs --tail 100 atlas-enterprise-api
          exit 1

      # ----------------------------------------
      # VERIFY STREAMLIT
      # ----------------------------------------

      - name: Verify Streamlit Deployment
        run: |
          set -euo pipefail

          for i in {1..15}; do
            if curl --fail --silent \
              http://127.0.0.1:8501/_stcore/health; then

              echo "Streamlit health check successful"
              exit 0
            fi

            echo "Waiting for Streamlit..."
            sleep 5
          done

          echo "::error::Streamlit health check failed"
          docker logs --tail 100 atlas-enterprise-ui
          exit 1

      # ----------------------------------------
      # DEPLOYMENT STATUS
      # ----------------------------------------

      - name: Deployment Status
        run: |
          docker ps
          echo "Enterprise AI deployment completed successfully"

      
      # ----------------------------------------
      # CLEANUP OLD DOCKER IMAGES
      # ----------------------------------------

      - name: Cleanup Old Docker Images
        if: success()
        run: |
          set -euo pipefail

          echo "Removing unused Docker images..."

          docker image prune -a -f

          echo "Docker cleanup completed."

          docker system df
          docker images

